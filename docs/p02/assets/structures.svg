<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1520" viewBox="0 0 1450 1520">
  <rect width="1450" height="1520" fill="#1e1e2e"/>
  <style>
    .title { fill: #89b4fa; font: 700 25px 'DejaVu Sans Mono', monospace; }
    .code { fill: #cdd6f4; font: 22px 'DejaVu Sans Mono', monospace; }
    .comment { fill: #a6adc8; font: 22px 'DejaVu Sans Mono', monospace; }
    .keyword { fill: #cba6f7; }
